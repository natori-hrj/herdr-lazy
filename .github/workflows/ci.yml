name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          # Windows is declared in `platforms`, so it is built here rather than taken on
          # trust. Without the cfg(windows) crossterm entry in Cargo.toml this job is what
          # fails: the crate stops the build with compile_error! when its `windows`
          # feature is absent.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # `--component` takes one value; a bare second name is parsed as a toolchain.
      - run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup target add ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}

  # The declared MSRV is a promise; check it rather than letting it rot.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - shell: bash
        run: |
          set -euo pipefail
          msrv=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          rustup toolchain install "$msrv" --profile minimal
          rustup target add x86_64-unknown-linux-musl --toolchain "$msrv"
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo "+$msrv" test --locked --target x86_64-unknown-linux-musl
