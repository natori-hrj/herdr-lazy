name: Native backoff validation

on:
  push:
    branches: [validation/v047-native-backoff]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal
      - run: python scripts/run-native-backoff.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backoff-${{ runner.os }}
          path: native-evidence/
          if-no-files-found: error
