name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  audit:
    uses: ./.github/workflows/audit.yml

  build:
    needs: audit
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            native: true
          # The arm64 runner cross-compiles the Intel binary.
          - target: x86_64-apple-darwin
            os: macos-latest
            native: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            native: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            native: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            native: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - if: matrix.native
        run: cargo test --locked --target ${{ matrix.target }}

      - if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          expected=$(sh scripts/build-fingerprint.sh)
          actual=$(powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-fingerprint.ps1 | tr -d '\r')
          test "$expected" = "$actual"

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' herdr-plugin.toml | head -1)

          fingerprint=$(sh scripts/build-fingerprint.sh)
          asset="herdr-lazy-${version}-${fingerprint}-${{ matrix.target }}.tar.gz"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match manifest version ${version}" >&2
            exit 1
          fi

          staging=$(mktemp -d)
          binary="target/${{ matrix.target }}/release/herdr-lazy"
          if [[ "${{ matrix.target }}" == *-windows-* ]]; then
            binary="${binary}.exe"
          fi
          cp "$binary" "$staging/"
          binary_name=$(basename "$binary")
          tar -czf "$asset" -C "$staging" "$binary_name"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" | cut -d' ' -f1 > "$asset.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$asset" | cut -d' ' -f1 > "$asset.sha256"
          else
            ASSET_PATH="$asset" powershell.exe -NoProfile -Command \
              "(Get-FileHash -LiteralPath \$env:ASSET_PATH -Algorithm SHA256).Hash.ToLowerInvariant()" \
              > "$asset.sha256"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    if: github.ref_type == 'tag'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Verify packaged assets
        working-directory: assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(*.tar.gz)
          checksums=(*.tar.gz.sha256)
          test "${#archives[@]}" -eq 5
          test "${#checksums[@]}" -eq 5
          for archive in "${archives[@]}"; do
            printf '%s  %s\n' "$(cat "$archive.sha256")" "$archive" | sha256sum --check
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if release=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,assets --jq '.isDraft, (.assets[].name)'); then
            draft=${release%%$'\n'*}
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag --draft
            draft=true
          fi
          if [ "$draft" = true ]; then
            gh release upload "$GITHUB_REF_NAME" assets/*.tar.gz assets/*.tar.gz.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            download_asset() {
              gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --pattern "$1" --output -
            }

            missing=()
            for archive in assets/*.tar.gz; do
              name=${archive##*/}
              checksum="$archive.sha256"
              if grep -Fxq -- "$name" <<< "$release"; then
                if ! grep -Fxq -- "$name.sha256" <<< "$release"; then
                  digest=$(download_asset "$name" | sha256sum)
                  printf '%s\n' "${digest%% *}" > "$checksum"
                  missing+=("$checksum")
                fi
              elif grep -Fxq -- "$name.sha256" <<< "$release"; then
                published_digest=$(download_asset "$name.sha256")
                if [ "$published_digest" != "$(cat "$checksum")" ]; then
                  echo "::error::$name does not match the published checksum" >&2
                  exit 1
                fi
                missing+=("$archive")
              else
                missing+=("$archive" "$checksum")
              fi
            done
            if [ "${#missing[@]}" -gt 0 ]; then
              gh release upload "$GITHUB_REF_NAME" "${missing[@]}" --repo "$GITHUB_REPOSITORY"
            fi
          fi
      - name: Verify download URLs
        run: |
          set -euo pipefail
          for asset in assets/*.tar.gz assets/*.tar.gz.sha256; do
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/${asset##*/}"
            curl --fail --silent --show-error --location --retry 3 --output /dev/null "$url"
          done
