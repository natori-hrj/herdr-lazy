[package]
name = "herdr-lazy"
version = "0.44.4"
edition = "2021"
rust-version = "1.78"
description = "Be lazy: a curated, batteries-included plugin distro & manager for herdr"
license = "MIT"
repository = "https://github.com/natori-hrj/herdr-lazy"
homepage = "https://github.com/natori-hrj/herdr-lazy"
readme = "README.md"
keywords = ["herdr", "plugin-manager", "tui", "lockfile", "distro"]
categories = ["command-line-utilities", "development-tools"]

[profile.release]
strip = true
lto = "thin"

[[bin]]
name = "herdr-lazy"
path = "src/main.rs"

# The manager uses the Herdr CLI for plugin operations.
# TUI dependencies provide raw terminal input and Unicode display-cell widths.
#
# crossterm provides terminal input and lets the UI draw directly to a terminal.
[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events"] }
unicode-width = { version = "0.2", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["event", "fs"] }

# crossterm's `windows` feature is not optional on Windows — it gates the
# winapi/crossterm_winapi backends, and the crate hard-fails the build with
# `compile_error!` when it is absent. default-features = false drops it, so it
# has to come back explicitly for the Windows target. The feature only pulls
# dependencies that crossterm itself declares under cfg(windows), so scoping it
# here keeps the Unix dependency graph exactly as it was.
[target.'cfg(windows)'.dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }
