id = "herdr-lazy"
name = "herdr-lazy"
version = "0.43.1"
# 0.9.0 is the first supported floor that resolves relative plugin commands from the plugin
# root on every platform. That lets the runtime entries below use one command shape instead of
# carrying Windows-only twins.
min_herdr_version = "0.9.0"
description = "Be lazy: a curated, batteries-included plugin distro & manager for herdr"
platforms = ["linux", "macos", "windows"]

# herdr runs this after `plugin install`, before registering the plugin.
# Both paths produce the platform's release binary, which the actions and pane below execute.
#
# On Unix and Windows, try a checksum-verified prebuilt binary first so installing does not
# require a Rust toolchain; the platform-specific script falls back to `cargo build --release`
# whenever that is not possible.
[[build]]
platforms = ["linux", "macos"]
command = ["/bin/sh", "scripts/fetch-or-build.sh"]

[[build]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/fetch-or-build.ps1"]

# herdr runs this once after the server starts. It converges the machine to your
# list only when `auto-sync` is on — otherwise it exits immediately and silently. See
# `cmd_startup` for why it installs missing plugins but never prunes or updates.
[[startup]]
command = ["./target/release/herdr-lazy", "startup"]

# Herdr 0.9.0 resolves these relative commands from the plugin root. Keep the runtime entries
# platform-neutral; only the build step needs separate shell forms.

# Keep a quiet, workspace-matched lifecycle hint for the manage pane. The event command only
# records Herdr's context under HERDR_PLUGIN_STATE_DIR; it never installs, removes, enables, or
# disables a plugin and never edits plugins.list or plugins.lock.
[[events]]
on = "worktree.created"
command = ["./target/release/herdr-lazy", "event"]

[[events]]
on = "worktree.opened"
command = ["./target/release/herdr-lazy", "event"]

# Actions surface herdr-lazy inside herdr's command palette.
[[actions]]
id = "probe"
title = "Lazy: probe CLI bridge"
contexts = ["workspace"]
command = ["./target/release/herdr-lazy", "probe"]

[[actions]]
id = "init"
title = "Lazy: install curated defaults"
contexts = ["workspace"]
command = ["./target/release/herdr-lazy", "init"]

[[actions]]
id = "sync"
title = "Lazy: sync plugins to bundle"
contexts = ["workspace"]
command = ["./target/release/herdr-lazy", "sync"]

[[actions]]
id = "update"
title = "Lazy: update unpinned plugins"
contexts = ["workspace"]
command = ["./target/release/herdr-lazy", "update"]

# Opens the pane rather than running the TUI directly: actions get no PTY, so `herdr-lazy ui`
# invoked as an action fails with "Device not configured". The binary asks herdr to open the
# real pane, so the action remains cross-platform without a shell wrapper.
[[actions]]
id = "manage"
title = "Lazy: open manage pane"
contexts = ["workspace"]
command = ["./target/release/herdr-lazy", "open-pane", "manage"]

# The workspace starter is a separate confirmation-first workflow. Like the manage action,
# the action asks Herdr to open a pane because actions do not receive a PTY of their own.
[[actions]]
id = "starter"
title = "Lazy: start workspace"
contexts = ["workspace"]
command = ["./target/release/herdr-lazy", "open-pane", "starter"]

# The manage UI. `overlay` is the right placement for it: a temporary zoomed view that
# hands focus back to whatever you were doing when it closes.
[[panes]]
id = "manage"
title = "herdr-lazy"
placement = "overlay"
command = ["./target/release/herdr-lazy", "ui"]

[[panes]]
id = "starter"
title = "herdr-lazy workspace starter"
placement = "overlay"
command = ["./target/release/herdr-lazy", "starter"]
